<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffd9e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ayuyu ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="stars" id="stars"></div>

    <div class="opening-love" id="openingLove">♥</div>

    <section class="center-content">
      <div class="small-heart">♡</div>
      <h1 class="name" id="name">Ayuyu</h1>
      <p class="subtitle" id="subtitle">a little collection of lovely moments</p>
    </section>

    <div class="photo-container" id="photoContainer"></div>
    <div class="petals" id="petals"></div>

    <div class="controls" id="controls">
      <button class="control-btn" id="loveBtn" aria-label="Tambah hati">
        <span>♥</span>
      </button>

      <button class="control-btn main-btn" id="startBtn">
        <span id="startIcon">♡</span>
        <span id="startText">Buka</span>
      </button>

      <button class="control-btn" id="pauseBtn" aria-label="Jeda animasi">
        <span id="pauseIcon">Ⅱ</span>
      </button>
    </div>

    <div class="message" id="message">
      <span class="message-heart">♥</span>
      <span id="messageText">For Ayuyu</span>
    </div>

    <div class="flash-heart" id="flashHeart">♥</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
